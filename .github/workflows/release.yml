name: Multi-Platform Release Pipeline (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    env:
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Pre-extract native plugin binaries and patch CMakeLists
        shell: pwsh
        run: |
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          Write-Host "Pub cache located at: $pubCache"

          # 1. Audiotags
          $audiotagsDir = Get-ChildItem -Directory -Path "$pubCache\hosted\pub.dev" -Filter "audiotags*" | Select-Object -First 1
          if ($audiotagsDir) {
            $winDir = Join-Path $audiotagsDir.FullName "windows"
            $dllPath = Join-Path $winDir "audiotags.dll"
            if (-not (Test-Path $dllPath)) {
              Write-Host "Pre-extracting audiotags native library to $winDir..."
              $tarGz = Join-Path $winDir "windows.tar.gz"
              curl.exe -sSfL -o $tarGz "https://github.com/erikas-taroza/audiotags/releases/download/v1.4.2/windows.tar.gz"
              tar -xzf $tarGz -C $winDir
              if (-not (Test-Path $dllPath)) {
                Write-Error "Failed to extract audiotags.dll"
                exit 1
              }
              Write-Host "Extracted audiotags.dll successfully."
            }
            $cMakeLists = Join-Path $winDir "CMakeLists.txt"
            if (Test-Path $cMakeLists) {
              $content = Get-Content -Raw $cMakeLists
              $content = $content -replace 'if\(NOT EXISTS \$\{LibPath\}\)', 'if(FALSE)'
              $content = $content -replace 'if\(NOT EXISTS "\$\{CMAKE_CURRENT_SOURCE_DIR\}/audiotags\.dll"\)', 'if(FALSE)'
              Set-Content -Path $cMakeLists -Value $content
              Write-Host "Neutralized audiotags CMakeLists.txt successfully."
            }
          }

          # 2. FFmpegKit
          $ffmpegDir = Get-ChildItem -Directory -Path "$pubCache\hosted\pub.dev" -Filter "ffmpeg_kit_flutter_new_full*" | Select-Object -First 1
          if ($ffmpegDir) {
            $prebuiltDir = Join-Path $ffmpegDir.FullName "windows\ffmpeg-kit"
            $marker = Join-Path $prebuiltDir "bin\.ffmpegkit_variant"
            if (-not (Test-Path $marker)) {
              Write-Host "Pre-extracting FFmpegKit native library to $prebuiltDir..."
              New-Item -ItemType Directory -Force -Path $prebuiltDir | Out-Null
              $zipUrl = "https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.0.0-full/ffmpeg-kit-windows-x86_64-full-8.0.0.zip"
              $zipPath = Join-Path $prebuiltDir "ffmpeg-kit.zip"
              curl.exe -sSfL -o $zipPath $zipUrl
              tar -xf $zipPath -C $prebuiltDir
              Remove-Item -Force $zipPath
              New-Item -ItemType Directory -Force -Path (Join-Path $prebuiltDir "bin") | Out-Null
              Set-Content -Path $marker -Value "8.0.0-full"
              Write-Host "Extracted FFmpegKit successfully."
            }
          }

          # 3. Metadata God
          $metaDir = Get-ChildItem -Directory -Path "$pubCache\hosted\pub.dev" -Filter "metadata_god*" | Select-Object -First 1
          if ($metaDir) {
            $winDir = Join-Path $metaDir.FullName "windows"
            $dllPath = Join-Path $winDir "v0.5.2\windows-x64\metadata_god.dll"
            if (-not (Test-Path $dllPath)) {
              Write-Host "Pre-extracting metadata_god native library..."
              $libRoot = Join-Path $winDir "v0.5.2"
              New-Item -ItemType Directory -Force -Path $libRoot | Out-Null
              $tarGz = Join-Path $winDir "v0.5.2.tar.gz"
              curl.exe -sSfL -o $tarGz "https://github.com/KRTirtho/metadata_god/releases/download/v0.5.2/other.tar.gz"
              tar -xzf $tarGz -C $libRoot
              if (-not (Test-Path $dllPath)) {
                Write-Error "Failed to extract metadata_god.dll to $dllPath"
                exit 1
              }
              Write-Host "Extracted metadata_god.dll successfully."
            }
            $cMakeLists = Join-Path $winDir "CMakeLists.txt"
            if (Test-Path $cMakeLists) {
              $content = Get-Content -Raw $cMakeLists
              $content = $content -replace 'if\(NOT EXISTS \$\{ArchivePath\}\)', 'if(FALSE)'
              $content = $content -replace 'if\(NOT EXISTS \$\{DllPath\}\)', 'if(FALSE)'
              Set-Content -Path $cMakeLists -Value $content
              Write-Host "Neutralized metadata_god CMakeLists.txt successfully."
            }
          }

          # 4. Neutralize any remaining cmake -E tar calls across all plugin CMakeLists.txt
          Get-ChildItem -Recurse -Path "$pubCache\hosted\pub.dev" -Filter "CMakeLists.txt" | ForEach-Object {
            $c = Get-Content -Raw $_.FullName
            if ($c -match '\$\{CMAKE_COMMAND\}\s+-E\s+tar') {
              Write-Host "Neutralizing tar command in $($_.FullName)"
              $c = $c -replace '\$\{CMAKE_COMMAND\}\s+-E\s+tar', '${CMAKE_COMMAND} -E echo'
              Set-Content -Path $_.FullName -Value $c
            }
          }

      - name: Build Windows Application (Release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\native_assets\windows" | Out-Null
          flutter build windows --release

      - name: Ensure Inno Setup is Installed
        run: choco install innosetup -y --no-progress

      - name: Package Windows Artifacts (Portable ZIP & Inno Setup Installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          
          # 1. Package Portable ZIP
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\looper-windows-x64-portable.zip" -Force
          Write-Host "Created Portable ZIP: dist\looper-windows-x64-portable.zip"
          
          # 2. Compile Inno Setup Installer (.exe)
          iscc windows\installer\looper_setup.iss
          Write-Host "Created Inno Setup Installer: dist\Looper-Setup-x64.exe"
          
          Get-ChildItem -Path dist | Format-Table Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*.exe

  build-linux:
    name: Build & Package Linux (x86_64)
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libgcrypt20-dev libmpv-dev libnotify-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            rpm patchelf
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install rpmbuild wrapper for spec version sanitization
        run: |
          sudo mv /usr/bin/rpmbuild /usr/bin/rpmbuild.real
          sudo cp .github/scripts/rpmbuild_wrapper.py /usr/bin/rpmbuild
          sudo chmod +x /usr/bin/rpmbuild
          sudo ln -sf /usr/bin/rpmbuild /usr/local/bin/rpmbuild

      - name: Install appimagetool for AppImage Packaging
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Platform Support
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Distributor
        run: flutter pub global activate flutter_distributor

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Package Linux Distributors (DEB, RPM, AppImage)
        run: |
          touch not
          flutter_distributor release --name dev --skip-clean
          rm -f not

      - name: Organize Linux Distribution Artifacts
        run: |
          mkdir -p build/linux-release-assets
          find dist/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} build/linux-release-assets/ \;
          # Package portable Linux tarball (.tar.gz) from bundle
          tar -czf build/linux-release-assets/looper-player-1.0.0-beta.2-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          ls -la build/linux-release-assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: build/linux-release-assets/*

  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-binaries
          merge-multiple: true

      - name: Download Linux Artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-binaries
          merge-multiple: true

      - name: List All Downloaded Binaries
        run: ls -lh release-binaries

      - name: Publish GitHub Release with Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          
          # Default fallback tag if triggered manually via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
            TAG_NAME="v1.0.0-beta.2"
          fi
          
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" =~ "beta" ]] || [[ "$TAG_NAME" =~ "alpha" ]] || [[ "$TAG_NAME" =~ "rc" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          ASSETS=()
          while IFS= read -r file; do
            ASSETS+=("$file")
          done < <(find release-binaries -type f)
          
          echo "Found ${#ASSETS[@]} release assets to upload:"
          printf ' - %s\n' "${ASSETS[@]}"
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              "${ASSETS[@]}" \
              $PRERELEASE_FLAG \
              --title "Looper $TAG_NAME — Desktop Evolution & Glassmorphic UI" \
              --notes-file RELEASE_NOTES.txt || \
            gh release create "$TAG_NAME" \
              "${ASSETS[@]}" \
              $PRERELEASE_FLAG \
              --title "Looper $TAG_NAME — Desktop Evolution & Glassmorphic UI" \
              --notes "Looper Player $TAG_NAME Desktop Release"
          fi
