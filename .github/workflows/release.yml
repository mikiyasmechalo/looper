name: Multi-Platform Release Pipeline (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Ensure Inno Setup is Installed
        run: choco install innosetup -y --no-progress

      - name: Package Windows Artifacts (Portable ZIP & Inno Setup Installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          
          # 1. Package Portable ZIP
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\looper-windows-x64-portable.zip" -Force
          Write-Host "Created Portable ZIP: dist\looper-windows-x64-portable.zip"
          
          # 2. Compile Inno Setup Installer (.exe)
          iscc windows\installer\looper_setup.iss
          Write-Host "Created Inno Setup Installer: dist\Looper-Setup-x64.exe"
          
          Get-ChildItem -Path dist | Format-Table Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*.exe

  build-linux:
    name: Build & Package Linux (x86_64)
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libgcrypt20-dev libmpv-dev libnotify-dev \
            libfuse2 rpm

      - name: Install appimagetool for AppImage Packaging
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Platform Support
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Distributor
        run: flutter pub global activate flutter_distributor

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Package Linux Distributors (DEB, RPM, AppImage, Archive)
        run: |
          flutter_distributor release --name dev --package linux-deb
          flutter_distributor release --name dev --package linux-rpm
          flutter_distributor release --name dev --package linux-appimage
          flutter_distributor release --name dev --package linux-archive

      - name: Organize Linux Distribution Artifacts
        run: |
          mkdir -p build/linux-release-assets
          find dist/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp {} build/linux-release-assets/ \;
          ls -la build/linux-release-assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: build/linux-release-assets/*

  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-binaries

      - name: Download Linux Artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-binaries

      - name: List All Downloaded Binaries
        run: ls -lh release-binaries

      - name: Publish GitHub Release with Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          
          # Default fallback tag if triggered manually via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
            TAG_NAME="v1.0.0-beta.1"
          fi
          
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" =~ "beta" ]] || [[ "$TAG_NAME" =~ "alpha" ]] || [[ "$TAG_NAME" =~ "rc" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          gh release create "$TAG_NAME" \
            release-binaries/* \
            $PRERELEASE_FLAG \
            --title "Looper Player $TAG_NAME" \
            --notes "### 🚀 Welcome to Looper Player $TAG_NAME!

          We are thrilled to introduce **Looper Player $TAG_NAME**—a high-fidelity, local-first cyber-glassmorphic music player engineered for desktop!

          #### 📦 Available Downloads

          **Windows (x64)**:
          - \`Looper-Setup-x64.exe\`: Windows Setup Wizard (installs per-user, sets audio file associations, and creates shortcuts).
          - \`looper-windows-x64-portable.zip\`: Standalone portable archive (extract and run immediately).

          **Linux (x86_64)**:
          - \`*.AppImage\`: Universal standalone executable for modern Linux distributions.
          - \`*.deb\`: Native package for Debian, Ubuntu, Linux Mint, and Pop!_OS.
          - \`*.rpm\`: Native package for Fedora, RHEL, and openSUSE.
          - \`*.tar.gz\`: Portable Linux archive.

          #### ✨ Highlights in this Release
          - **Dynamic Syllable & Karaoke Lyrics**: Word-level illuminated lyrics synchronized to playback with tap-to-seek and per-song offset calibration.
          - **Looper Analyze**: In-depth listening statistics, top songs, top artists, 30-day play trends, streaks, and genre breakdowns.
          - **Dual Floating Mini-Players**: Standard floating deck & compact corner player with real-time DSP spectrum visualizers.
          - **Expressive Seekbar**: Organic squiggly wave seekbar with pause gating, plus an optional flat progress bar for minimalists.
          - **Auto Battery Saver**: Intelligent power-saving mode triggered on low laptop battery with OLED pure black override.
          - **18-Band Graphical EQ**: Interactive drag-to-shape equalization curve.
          - **100% Offline & Private**: Pure local playback with zero telemetry and sub-millisecond library scanning.

          ---
          *Requires \`libmpv\` on Linux (\`sudo apt install libmpv2\` or \`sudo dnf install mpv-libs\`).*"
