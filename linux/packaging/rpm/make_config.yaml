display_name: Looper Player
name: looper_player
version: 1.0.0
release: beta.2
summary: A modern, high-fidelity music player for Linux.
description: A modern, high-fidelity music player for Linux.
license: GPL-3.0
group: Applications/Multimedia
url: https://github.com/mikiyasmechalo/looper
vendor: Mikiyas Mechalo
packager: Mikiyas Mechalo
packagerEmail: mikeme@example.com
icon: assets/logo_linux.png
categories:
  - AudioVideo
  - Audio
  - Music
  - Player
requires:
  - gtk3
  - mpv-libs
install: |
  mkdir -p %{buildroot}%{_bindir}
  mkdir -p %{buildroot}%{_datadir}/%{name}
  mkdir -p %{buildroot}%{_datadir}/applications
  mkdir -p %{buildroot}%{_datadir}/metainfo
  mkdir -p %{buildroot}%{_datadir}/pixmaps
  if [ -d "%{_topdir}/BUILD/looper_player" ]; then
    cp -r %{_topdir}/BUILD/looper_player/* %{buildroot}%{_datadir}/%{name}
    cp -r %{_topdir}/BUILD/looper_player.desktop %{buildroot}%{_datadir}/applications/%{name}.desktop
    cp -r %{_topdir}/BUILD/looper_player.png %{buildroot}%{_datadir}/pixmaps/%{name}.png
    cp -r %{_topdir}/BUILD/looper_player*.xml %{buildroot}%{_datadir}/metainfo/%{name}.appdata.xml || :
  else
    cp -r looper_player/* %{buildroot}%{_datadir}/%{name}
    cp -r looper_player.desktop %{buildroot}%{_datadir}/applications/%{name}.desktop
    cp -r looper_player.png %{buildroot}%{_datadir}/pixmaps/%{name}.png
    cp -r looper_player*.xml %{buildroot}%{_datadir}/metainfo/%{name}.appdata.xml || :
  fi
  ln -s %{_datadir}/%{name}/looper_player %{buildroot}%{_bindir}/%{name}
